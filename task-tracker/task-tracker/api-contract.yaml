openapi: 3.0.3
info:
  title: 个人任务完成情况跟踪系统 API
  version: 1.0.0
  description: 4 个微服务的聚合 OpenAPI 契约

servers:
  - url: http://localhost:3001/api
    description: user-service
  - url: http://localhost:3002/api
    description: task-service
  - url: http://localhost:3003/api
    description: tracking-service
  - url: http://localhost:3004/api
    description: report-service

paths:
  /users/register:
    post:
      summary: 用户注册
      tags: [user-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, example: alice }
                email: { type: string, format: email, example: alice@x.com }
                password: { type: string, example: Pass1234 }
      responses:
        '200': { description: 注册成功, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseUserId' } } } }

  /users/login:
    post:
      summary: 用户登录
      tags: [user-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, password]
              properties:
                account: { type: string, example: alice }
                password: { type: string, example: Pass1234 }
      responses:
        '200': { description: 登录成功返回 JWT, content: { application/json: { schema: { $ref: '#/components/schemas/ApiResponseToken' } } } }

  /users/profile:
    get:
      summary: 获取个人信息
      tags: [user-service]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 当前用户信息 }
    put:
      summary: 更新个人信息（禁止修改密码）
      tags: [user-service]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                nickname: { type: string }
      responses:
        '200': { description: 更新成功 }

  /tasks:
    post:
      summary: 创建任务
      tags: [task-service]
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 2000 }
                category: { type: string, maxLength: 50 }
                priority: { type: string, enum: [low, medium, high, urgent], default: medium }
                dueDate: { type: string, format: date-time }
      responses:
        '200': { description: 创建成功 }
    get:
      summary: 任务列表（游标分页 + 过滤）
      tags: [task-service]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20, maximum: 100 } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: priority, schema: { $ref: '#/components/schemas/Priority' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/TaskStatus' } }
      responses:
        '200': { description: 分页任务列表 }

  /tasks/{id}:
    get:
      summary: 任务详情
      tags: [task-service]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: 任务详情 } }
    put:
      summary: 编辑任务
      tags: [task-service]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: 更新成功 } }
    delete:
      summary: 删除任务
      tags: [task-service]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: 删除成功 } }

  /tasks/{id}/status:
    patch:
      summary: 更新任务状态
      tags: [task-service]
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TaskStatus' }
      responses: { '200': { description: 状态更新成功 } }

  /tracking/progress:
    get:
      summary: 完成进度
      tags: [tracking-service]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 进度数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: integer, example: 0 }
                  data:
                    type: object
                    properties:
                      completed: { type: integer }
                      inProgress: { type: integer }
                      todo: { type: integer }
                      completionRate: { type: number }

  /tracking/completions:
    get:
      summary: 完成历史（游标分页）
      tags: [tracking-service]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: taskId, schema: { type: string } }
        - { in: query, name: cursor, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 20 } }
      responses: { '200': { description: 完成记录分页 } }

  /reports/summary:
    get:
      summary: 完成情况汇总
      tags: [report-service]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: startDate, required: true, schema: { type: string, format: date } }
        - { in: query, name: endDate, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: 汇总数据 } }

  /reports/daily:
    get:
      summary: 日报表
      tags: [report-service]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: startDate, required: true, schema: { type: string, format: date } }
        - { in: query, name: endDate, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: 每日完成数量序列 } }

  /reports/trend:
    get:
      summary: 完成率趋势
      tags: [report-service]
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: startDate, required: true, schema: { type: string, format: date } }
        - { in: query, name: endDate, required: true, schema: { type: string, format: date } }
        - { in: query, name: period, required: true, schema: { type: string, enum: [daily, weekly, monthly] } }
      responses: { '200': { description: 趋势序列 } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      required: [code, message, data]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data: { nullable: true }
    ApiResponseUserId:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - properties:
            data: { type: object, properties: { userId: { type: string } } }
    ApiResponseToken:
      allOf:
        - $ref: '#/components/schemas/ApiResponse'
        - properties:
            data:
              type: object
              properties:
                token: { type: string }
                expiresIn: { type: integer, example: 604800 }
    Priority:
      type: string
      enum: [low, medium, high, urgent]
    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
